# webapp/docker/nginx.conf
# Nginx configuration for Vue/Quasar SPA
# Comments in English only

# --- Social crawler routing (Open Graph) -------------------------------------
# Link-preview bots do not execute JS, so the SPA shell only ever exposes the
# generic homepage meta tags. For the paths the API can render server-side we
# hand the request over to the API container, keeping the same URL.
# Search engine crawlers are deliberately NOT listed: the API response carries
# <meta name="robots" content="noindex">, which would deindex the site.
map $http_user_agent $og_ua {
    default 0;
    "~*facebookexternalhit|facebookcatalog|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|slack-imgproxy|discordbot|skypeuripreview|redditbot|pinterest|embedly|iframely|opengraph|vkshare|bitlybot|bufferbot|nuzzel|viber|mastodon" 1;
}

# Search engines are routed only to /books/*, where the API render carries real content and
# is therefore indexable. The homepage and profile renders are still body-less stubs that emit
# noindex, so sending a search engine there would deindex pages that rank today.
map $http_user_agent $se_ua {
    default 0;
    "~*googlebot|google-inspectiontool|bingbot|duckduckbot|applebot|yandexbot|baiduspider" 1;
}

map $uri $se_path {
    default 0;
    "~^/books/[A-Za-z0-9_-]+/?$" 1;
}

map "$se_ua$se_path" $se_route {
    default 0;
    "11" 1;
}

# Manual override for debugging: ?og=1
map $arg_og $og_forced {
    default 0;
    "1" 1;
    "true" 1;
}

# Only the paths SocialMediaCrawlerMiddleware knows how to render.
# The username class has no dot, so robots.txt and sitemap.xml never match.
map $uri $og_path {
    default 0;
    "~^/$" 1;
    "~^/books/[A-Za-z0-9_-]+/?$" 1;
    "~^/(?!books$|health$|healthz$|docs$|documentation$|up$|image-proxy$|assets$|storage$)[A-Za-z0-9_-]+/?$" 1;
}

# (crawler UA OR ?og=1) AND supported path
map "$og_ua$og_forced$og_path" $og_route {
    default 0;
    "101" 1;
    "011" 1;
    "111" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The crawler hand-off below is reached through an error_page and then falls
    # back through a second one; nginx will not chain them without this.
    recursive_error_pages on;

    # Health check endpoint
    # Generated from the catalogue by the API: /sitemap.xml is the index, /sitemap-N.xml the
    # paginated children. The static file they replaced listed authenticated routes and a
    # literal "/:username".
    location ~ ^/sitemap(-\d+)?\.xml$ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $sitemap_upstream "api:8080";
        proxy_pass http://$sitemap_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Cache HTML files briefly
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        error_page 418 = @og_proxy;
        if ($og_route) { return 418; }
        if ($se_route) { return 418; }

        try_files $uri $uri/ /index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Crawler hand-off to the API container, same URL, no cross-domain redirect
    location @og_proxy {
        # Docker embedded DNS, re-resolved so an API container restart is picked up.
        # resolver_timeout must be short: an unresolvable upstream otherwise stalls
        # the crawler for the 30s default before the fallback kicks in.
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $og_upstream "api:8080";
        proxy_pass http://$og_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # A crawler must never see an error page or a redirect loop
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 400 401 403 404 405 408 429 500 502 503 504 = @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml;
}
