name: Deploy

# Production runs on Hostinger shared hosting (Business plan), deployed over SSH + rsync.
# Server layout (paths relative to the SSH user's home):
#   domains/livrolog.com/api/          Laravel app, outside any docroot
#   domains/livrolog.com/public_html/  Vue build, docroot of livrolog.com
#   domains/livrolog.com/public_html/api -> ../api/public  (symlink, docroot of api.livrolog.com)
# The scheduler (which also drains the queue) runs from an hPanel cron job, see CLAUDE.md.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'api/**'
      - 'webapp/**'
  workflow_dispatch:

# Never cancel a deploy halfway through an upload
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  required-checks:
    uses: ./.github/workflows/required-checks.yml

  deploy:
    needs: required-checks
    runs-on: ubuntu-latest
    environment: Production
    env:
      SSH_TARGET: u388701681@212.85.6.5
      SSH_PORT: '65002'
      APP_DIR: domains/livrolog.com/api
      WEB_DIR: domains/livrolog.com/public_html
      # The CLI default `php` on Hostinger is 8.2
      PHP: /opt/alt/php84/usr/bin/php

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install API dependencies
        working-directory: api
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      # Type checking already ran in required-checks
      - name: Build webapp
        working-directory: webapp
        env:
          VITE_API_URL: https://api.livrolog.com
          VITE_FRONTEND_URL: https://livrolog.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_APP_NAME: LivroLog
        run: |
          yarn install --frozen-lockfile
          yarn build-only

      # Shared hosting has no Redis: queue, cache and sessions use the database/filesystem
      - name: Write production .env
        run: |
          cat > api/.env <<'EOF'
          APP_NAME=LivroLog
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://api.livrolog.com
          APP_FRONTEND_URL=https://livrolog.com
          LOG_CHANNEL=stack
          LOG_LEVEL=error
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=u388701681_livrolog
          DB_USERNAME=u388701681_livrolog
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          QUEUE_CONNECTION=database
          CACHE_STORE=database
          SESSION_DRIVER=file
          MAIL_MAILER=resend
          MAIL_FROM_ADDRESS=noreply@livrolog.com
          MAIL_FROM_NAME=LivroLog
          RESEND_KEY=${{ secrets.RESEND_KEY }}
          GOOGLE_BOOKS_API_KEY=${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          AMAZON_PA_API_KEY=${{ secrets.AMAZON_PA_API_KEY }}
          AMAZON_PA_SECRET_KEY=${{ secrets.AMAZON_PA_SECRET_KEY }}
          AMAZON_ASSOCIATE_TAG=${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AMAZON_SITESTRIPE_ENABLED=${{ secrets.AMAZON_SITESTRIPE_ENABLED }}
          AMAZON_CREATORS_API_ENABLED=true
          AMAZON_CREATORS_CREDENTIAL_ID=${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET=${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_CREATORS_APPLICATION_ID=livrolog01-20.livrolog
          AMAZON_API_PROVIDER=creators
          EOF

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, fingerprint SHA256:pKgn9kKtAG90dfTmlX5zVwR73qO8qlwOp9gbCkT2FTQ (hPanel > Acesso SSH)
          echo "[212.85.6.5]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGVsuvi5KWWZY42cz0L5MMa0ny5njVNeDCSkYTcJyxuM" > ~/.ssh/known_hosts

      # storage/ lives only on the server (logs, OG image cache); excluding it also protects it from --delete
      - name: Upload
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            --exclude='/storage/' --exclude='/tests/' --exclude='/docker/' \
            api/ "$SSH_TARGET:$APP_DIR/"
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            --exclude='/api' --exclude='/.well-known/' \
            webapp/dist/ "$SSH_TARGET:$WEB_DIR/"

      - name: Migrate and cache
        run: |
          ssh -p "$SSH_PORT" "$SSH_TARGET" "set -e
            cd $APP_DIR
            mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache"

      - name: Smoke test
        run: |
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://api.livrolog.com/healthz
          curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors https://livrolog.com/
          # Crawler routing (.htaccess -> Laravel): only the server render carries noindex, the SPA shell says index
          curl -fsS -A 'facebookexternalhit/1.1' https://livrolog.com/ | grep -q 'noindex, follow'
